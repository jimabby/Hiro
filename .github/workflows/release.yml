name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the installers but do not publish a release'
        type: boolean
        default: true

# Least privilege: nothing by default, and each job asks for what it needs.
# Only the build job can write, because electron-builder uploads the installers
# to the GitHub release — and even there the token is handed only to the step
# that publishes (see "Build" below).
permissions: {}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HIRO_SKIP_BROWSER_INSTALL: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # A tag that disagrees with package.json ships an installer whose
      # auto-updater compares against the wrong version forever. Catch it before
      # three platform builds run.
      - name: Tag must match web/package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./web/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match web/package.json version $pkg" >&2
            exit 1
          fi
          echo "Releasing $pkg"

      - run: npm ci --prefix web

      - run: npm run lint --prefix web

      - run: npm test --prefix web

  build:
    name: Build ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    permissions:
      contents: write # the publish step uploads installers to the GitHub release
    env:
      # True for a real tagged release; a dry run neither publishes nor insists
      # on signing, so signing can be developed without cutting a tag.
      PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true }}
      # build:publish and build:dry have no prebuild hook, so the Chromium
      # download in `npm ci` is the only one — make its failure fail the job
      # instead of shipping an installer that cannot scrape.
      HIRO_REQUIRE_BROWSER: '1'
      # No GH_TOKEN here. At job level it reached every step — including
      # `npm ci`, where every dependency's install script could read a token
      # that can write to this repository's releases.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Otherwise the token is left in .git/config for every later step,
          # install scripts included, to read.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Installed FIRST, while this job holds no secrets at all: nothing has
      # been written to GITHUB_ENV and no signing material exists on disk. Install
      # scripts (Electron's binary download, Chromium for the scraper) run with
      # nothing to steal.
      #
      # Chromium is NOT skipped here — each runner downloads its own platform
      # build so electron-builder can bundle it into that platform's installer.
      - run: npm ci --prefix web

      # Signing material exists only inside this step: passed as step-level env
      # and exported in this shell, never written to GITHUB_ENV (which hands it to
      # every LATER step too), and the notarization key file is deleted when the
      # step ends. GITHUB_ENV is also where the old version put it BEFORE
      # `npm ci`, so every dependency's install script could read the signing
      # certificate.
      #
      # The mac job distinguishes "no certificate configured" (build unsigned,
      # don't fail here — the verify step below decides) from "certificate
      # configured" (sign and notarize). See RELEASING.md for each value.
      #
      # GH_TOKEN is given only when publishing; a dry run has no use for it.
      - name: Build (sign, and publish on a tagged release)
        shell: bash
        env:
          GH_TOKEN: ${{ (startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true) && secrets.GITHUB_TOKEN || '' }}
          WIN_CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          MAC_CERT_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/private_keys"
          trap 'rm -rf "$key_dir"' EXIT

          case "$RUNNER_OS" in
            Windows)
              if [ -n "$WIN_CERT_BASE64" ]; then
                # electron-builder reads a base64 PFX straight out of CSC_LINK.
                export CSC_LINK="$WIN_CERT_BASE64" CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
                echo "Windows Authenticode signing: enabled"
              else
                echo "Windows Authenticode signing: NO CERTIFICATE CONFIGURED — build will be unsigned"
              fi
              ;;
            macOS)
              if [ -n "$MAC_CERT_BASE64" ]; then
                export CSC_LINK="$MAC_CERT_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
                export CSC_IDENTITY_AUTO_DISCOVERY=true APPLE_TEAM_ID
                echo "Developer ID signing: enabled"

                # Notarization. electron-builder runs @electron/notarize
                # automatically once these are present; an App Store Connect API
                # key is preferred over APPLE_ID because it is scoped and
                # revocable. The .p8 must be a real file on disk.
                if [ -n "$APPLE_API_KEY_P8" ]; then
                  mkdir -p "$key_dir"
                  key_path="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
                  printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
                  export APPLE_API_KEY="$key_path" APPLE_API_KEY_ID APPLE_API_ISSUER
                  echo "Notarization: enabled"
                else
                  # Signed but un-notarized still trips Gatekeeper on first open,
                  # so this is a warning, not a clean state.
                  echo "Notarization: NO API KEY CONFIGURED — Gatekeeper will warn on first open"
                fi
              else
                # Without this electron-builder searches the (empty) keychain and
                # fails the job instead of producing an unsigned DMG.
                export CSC_IDENTITY_AUTO_DISCOVERY=false
                echo "Developer ID signing: NO CERTIFICATE CONFIGURED — build will be unsigned"
              fi
              ;;
            *)
              echo "Linux AppImages are not code-signed."
              ;;
          esac

          if [ "$PUBLISHING" = "true" ]; then
            npm run build:publish --prefix web
          else
            npm run build:dry --prefix web
          fi

      # Runs after the build so it inspects the artifacts that would actually
      # ship. On a real tagged release an unsigned Windows or macOS installer
      # fails the job, unless the repo owner has deliberately opted in to
      # shipping unsigned by setting the ALLOW_UNSIGNED_RELEASE variable.
      - name: Verify installer signatures
        shell: bash
        run: |
          flags=""
          if [ "$PUBLISHING" = "true" ] && [ "${{ vars.ALLOW_UNSIGNED_RELEASE }}" != "1" ]; then
            flags="--require-signed"
          fi
          node web/scripts/verify-signature.js $flags

      # Installs the artifact a user would download, launches it, and drives the
      # real renderer. This is the layer the unit suites cannot reach — the
      # packaged Windows navigation check that broke reload was invisible to all
      # 26 of them. See web/test/smoke/README.md.
      #
      # It runs in this job rather than a downstream one so it tests the binary
      # that was just built, with no artifact round trip. electron-builder
      # publishes GitHub releases as DRAFTS, so a failure here means the draft is
      # never promoted and no user ever sees the build.
      - name: Install xvfb (Linux only — Electron needs a display)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Packaged smoke test
        run: npm run smoke --prefix web

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          retention-days: 14
          path: |
            web/dist-electron/*.dmg
            web/dist-electron/*.exe
            web/dist-electron/*.AppImage
            web/dist-electron/*.blockmap
            web/dist-electron/*.yml
          if-no-files-found: error
